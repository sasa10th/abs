<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ABS Lite</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--field:#10231b;--field2:#183a2b;--chalk:#f2efe6;--mist:#8fa79a;--amber:#f2b134;--seam:#d6402f;--grass:#3e9e6b;--line:rgba(242,239,230,.18)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--field);color:var(--chalk);font:15px/1.5 'IBM Plex Sans KR',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.disp{font-family:'Black Han Sans','IBM Plex Sans KR',sans-serif;font-weight:400;letter-spacing:.01em}
button,select,input,summary{font:inherit;color:inherit}
button{min-height:52px;padding:0 18px;border-radius:14px;border:1.5px solid var(--line);background:transparent;font-weight:600;cursor:pointer}
button:active{transform:scale(.98)}
button:focus-visible,summary:focus-visible,input:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
button.main{background:var(--amber);border-color:var(--amber);color:#2a1d00}
.hide{display:none!important}
#setup{max-width:480px;margin:0 auto;padding:22px 20px 28px;min-height:100dvh;display:flex;flex-direction:column;gap:18px}
#setup.sheet{position:fixed;inset:0;z-index:3;background:rgba(16,35,27,.96);overflow:auto;min-height:0;max-width:none;align-items:center;justify-content:center;text-align:center}
.sheet .hero,.sheet h1,.sheet .sub{display:none}
.hero{width:100%;height:auto;margin-top:6px}
h1{margin:0;font-size:46px;line-height:1.05}
.sub{margin:-8px 0 0;color:var(--mist)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-height:92px;padding:14px;text-align:left}
.tile b{font-size:18px}.tile small{color:var(--mist);font-weight:400;line-height:1.35}
.tile.act{border-color:var(--amber);background:rgba(242,177,52,.12)}
#role{position:absolute;opacity:0;pointer-events:none}
#info{margin:0;color:var(--mist)}
.sheet #info{color:var(--chalk);font-size:17px;font-weight:600}
#qr{background:var(--chalk);padding:14px;border-radius:16px;display:inline-block;line-height:0}#qr:empty{display:none}
#cam{max-width:560px;margin:0 auto;padding:12px 12px 20px}
#wrap{position:relative;width:100%;background:#000;border-radius:18px;overflow:hidden;box-shadow:0 0 0 1.5px var(--line)}
#v,#ov{position:absolute;inset:0;width:100%;height:100%}
#st{margin:12px 2px;padding-left:10px;border-left:3px solid var(--amber);color:var(--chalk);min-height:24px}
.acts{display:grid;grid-template-columns:1fr 1.4fr;gap:10px}
#arm.on{background:var(--seam);border-color:var(--seam);color:#fff}
#arm.on::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:#fff;margin-right:9px;animation:pl 1.2s infinite}
@keyframes pl{50%{opacity:.25}}
details{margin-top:14px;border:1.5px solid var(--line);border-radius:14px;padding:0 14px}
summary{min-height:48px;display:flex;align-items:center;cursor:pointer;font-weight:600}
.set{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;padding:4px 0 16px}
.set label{display:flex;flex-direction:column;gap:6px;color:var(--mist);font-size:13px}
input[type=number]{width:100%;min-height:44px;padding:0 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--field2);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--amber)}
#res{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:8px;z-index:5;background:var(--field);text-align:center;padding:20px}
#res:has(#rb.S){background:var(--seam)}#res:has(#rb.B){background:var(--grass)}
#rb{font-size:min(44vw,220px);line-height:.95;color:var(--chalk)}
#rt{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
#res:has(#rb.S) #rt::before{content:"스트라이크 · "}#res:has(#rb.B) #rt::before{content:"볼 · "}
#res small{opacity:.8}
.card{background:var(--chalk);padding:10px;border-radius:16px;line-height:0}
@media(prefers-reduced-motion:reduce){#arm.on::before{animation:none}}
</style></head><body>
<div id="setup">
  <svg class="hero" viewBox="0 0 400 250" fill="none" stroke="#f2efe6" stroke-width="2" aria-hidden="true">
    <rect x="130" y="20" width="140" height="150" rx="3" stroke-width="3"/>
    <path d="M176.7 20v150M223.3 20v150M130 70h140M130 120h140" stroke-opacity=".28"/>
    <path d="M150 196h100v14l-50 22-50-22z" fill="#f2efe6" fill-opacity=".1"/>
    <path d="M30 230C120 170 190 120 214 92" stroke="#f2b134" stroke-dasharray="3 9" stroke-linecap="round" stroke-width="3"/>
    <circle cx="214" cy="92" r="11" fill="#f2efe6" stroke="none"/>
    <path d="M208 85c3 4 3 11 0 15M220 84c-3 4-3 11 0 16" stroke="#d6402f" stroke-width="1.6"/>
  </svg>
  <div><h1 class="disp">ABS Lite</h1><p class="sub">폰 두 대로 즉시 판정하는 스트라이크 존</p></div>
  <div id="hostbox">
    <select id="role"><option value="side">측면</option><option value="front">정면</option></select>
    <p style="margin:0 0 10px;color:var(--mist)">이 폰을 놓을 위치</p>
    <div class="tiles">
      <button class="tile act" data-r="side"><b>측면</b><small>투구 방향과 직각. 높이를 잰다</small></button>
      <button class="tile" data-r="front"><b>정면</b><small>포수 뒤 중심선. 좌우를 잰다</small></button>
    </div>
    <button class="main" id="create" style="width:100%;margin-top:14px">방 만들기</button>
  </div>
  <div id="joinbox" class="hide"><p style="margin-top:0">만들어 둔 방에 연결합니다.</p><button class="main" id="join" style="width:100%">참가</button></div>
  <p id="info"></p><div><div id="qr"></div></div>
</div>

<div id="cam" class="hide">
  <div id="wrap"><video id="v" playsinline muted autoplay></video><canvas id="ov"></canvas></div>
  <div id="st"></div>
  <div class="acts"><button id="calb">① 보정</button><button id="arm" class="main">② 측정 시작</button></div>
  <details><summary>설정</summary>
    <div class="set">
      <label>타자 키 (cm)<input id="bh" type="number" value="175" inputmode="numeric"></label>
      <span></span>
      <label>존 아래 (%)<input id="lo" type="number" value="28" inputmode="numeric"></label>
      <label>존 위 (%)<input id="hi" type="number" value="56" inputmode="numeric"></label>
      <label>민감도<input id="thr" type="range" min="10" max="90" value="35"></label>
      <label>밝기 기준<input id="br" type="range" min="60" max="230" value="130"></label>
    </div>
  </details>
</div>
<div id="res" onclick="this.style.display='none'"><b id="rb" class="disp"></b><div id="rt"></div><div class="card"><canvas id="zc" width="180" height="220"></canvas></div><small>탭하면 닫힘</small></div>

<script>
const $=id=>document.getElementById(id);
const nowE=()=>performance.timeOrigin+performance.now();
const PW=43.2, BR=3.7; // 플레이트 폭(cm), 공 반지름(cm)
let role,peer,conn,offset=0,armed=false,calMode=false,cal=[],last=null,buf=[],pending=[],lastCross=0,prev=null,detDraw=null;
const SW=320;let SH=180;
const sc=document.createElement('canvas'),sx=sc.getContext('2d',{willReadFrequently:true});
const v=$('v'),ov=$('ov'),octx=ov.getContext('2d');
const need=()=>role==='side'?3:2;
const PROMPT={side:['플레이트 위(홈플레이트 중앙선) 탭','스트라이크존 아래 끝 높이 탭','스트라이크존 위 끝 높이 탭'],front:['플레이트 왼쪽 끝 탭','플레이트 오른쪽 끝 탭']};
const st=s=>$('st').textContent=s;

// ---------- 시작 ----------
const room=(location.hash.match(/r=(\w+)/)||[])[1];
if(room){$('hostbox').classList.add('hide');$('joinbox').classList.remove('hide')}
$('create').onclick=async()=>{
  role=$('role').value;
  const code=Math.random().toString(36).slice(2,6).toUpperCase();
  try{await startCam()}catch(e){return $('info').textContent='카메라 오류: '+e.message}
  peer=new Peer('abslite-'+code);
  peer.on('connection',c=>{conn=c;wire();});
  const url=location.href.split('#')[0]+'#r='+code;
  $('info').textContent='다른 폰으로 QR 스캔 → 참가 (방 '+code+')';
  new QRCode($('qr'),{text:url,width:180,height:180});
  $('setup').classList.remove('hide');$('cam').classList.remove('hide');
  $('setup').classList.add('sheet');
  $('hostbox').classList.add('hide');
};
$('join').onclick=async()=>{
  try{await startCam()}catch(e){return $('info').textContent='카메라 오류: '+e.message}
  peer=new Peer();
  peer.on('open',()=>{conn=peer.connect('abslite-'+room,{reliable:true});wire();});
  peer.on('error',e=>$('info').textContent='연결 오류: '+e.type);
  $('joinbox').classList.add('hide');$('info').textContent='연결 중…';
};
async function startCam(){
  const s=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:'environment',width:{ideal:1280},height:{ideal:720},frameRate:{ideal:60}}});
  v.srcObject=s;await v.play();
  if(!v.videoWidth)await new Promise(r=>v.onloadedmetadata=r);
  $('wrap').style.aspectRatio=v.videoWidth+'/'+v.videoHeight;
  SH=Math.round(SW*v.videoHeight/v.videoWidth);sc.width=SW;sc.height=SH;ov.width=SW*2;ov.height=SH*2;
  $('cam').classList.remove('hide');$('setup').classList.add('hide');
  schedule();
}
function wire(){
  conn.on('open',()=>{
    $('setup').classList.add('hide');$('cam').classList.remove('hide');
    if(role)conn.send({t:'hello',role});
    sync();
  });
  conn.on('data',onMsg);
  conn.on('close',()=>st('연결 끊김'));
}
function onMsg(m){
  if(m.t==='hello'){role=m.role==='side'?'front':'side';roleLabel()}
  else if(m.t==='ping')conn.send({t:'pong',t0:m.t0,t1:nowE()});
  else if(m.t==='pong'){const t2=nowE(),rtt=t2-m.t0;if(!sync.best||rtt<sync.best){sync.best=rtt;offset=m.t1-(m.t0+t2)/2}}
  else if(m.t==='cross'&&role==='front'){pending.push({...m,rx:nowE()});}
  else if(m.t==='result')showResult(m);
}
function sync(){let n=0;const i=setInterval(()=>{conn.send({t:'ping',t0:nowE()});if(++n>=8)clearInterval(i)},120)}
function roleLabel(){st((role==='side'?'측면':'정면')+' 폰 · '+(cal.length>=need()?'보정 완료':'보정 필요'))}

// ---------- 보정 ----------
$('calb').onclick=()=>{if(!role)return st('상대 폰 연결 대기 중');cal=[];calMode=true;st(PROMPT[role][0])};
ov.addEventListener('pointerdown',e=>{
  if(!calMode)return;
  const r=ov.getBoundingClientRect();
  cal.push({x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height});
  if(cal.length>=need()){calMode=false;roleLabel()}else st(PROMPT[role][cal.length]);
});
$('arm').onclick=()=>{
  if(cal.length<need())return st('먼저 보정하세요');
  armed=!armed;last=null;buf=[];$('arm').classList.toggle('on',armed);$('arm').textContent=armed?'측정 중 (정지)':'② 측정 시작';
};

// ---------- 프레임 처리 ----------
function schedule(){
  if(v.requestVideoFrameCallback)v.requestVideoFrameCallback(n=>{frame(n);schedule()});
  else requestAnimationFrame(n=>{frame(n);schedule()});
}
function frame(now){
  const t=performance.timeOrigin+now;
  sx.drawImage(v,0,0,SW,SH);
  const d=sx.getImageData(0,0,SW,SH).data,n=SW*SH,g=new Uint8Array(n);
  for(let i=0,j=0;i<n;i++,j+=4)g[i]=(d[j]*77+d[j+1]*150+d[j+2]*29)>>8;
  let det=null;
  if(prev&&armed&&cal.length>=need()){
    const thr=+$('thr').value,br=+$('br').value;let sxs=0,sys=0,c=0;
    for(let i=0;i<n;i++){if(g[i]>br&&g[i]-prev[i]>thr){sxs+=i%SW;sys+=(i/SW)|0;c++}}
    if(c>=2&&c<=300)det={t,x:sxs/c/SW,y:sys/c/SH,c};
  }
  prev=g;
  if(det){detDraw=det;(role==='side'?procSide:procFront)(det)}
  if(role==='front')procPending(t);
  draw();
}
function procSide(d){
  if(last&&d.t-last.t<120&&d.t>lastCross+3000){
    const L=cal[0].x;
    if((last.x-L)*(d.x-L)<=0&&last.x!==d.x){
      const k=(L-last.x)/(d.x-last.x),tc=last.t+k*(d.t-last.t),y=last.y+k*(d.y-last.y);
      const yn=(cal[1].y-y)/(cal[1].y-cal[2].y); // 0=존 하단, 1=존 상단
      lastCross=d.t;conn&&conn.send({t:'cross',ts:tc,yn});st('통과 감지 · 정면 폰 대기');
    }
  }
  last=d;
}
function procFront(d){buf.push(d);if(buf.length>90)buf.shift()}
function procPending(tNow){
  for(let i=pending.length-1;i>=0;i--){
    const p=pending[i],tc=p.ts-offset;
    const after=buf.find(b=>b.t>=tc),before=[...buf].reverse().find(b=>b.t<=tc);
    if(!(before&&after)&&nowE()-p.rx<400)continue;
    pending.splice(i,1);
    let xn;
    if(before&&after&&after.t>before.t)xn=before.x+(tc-before.t)/(after.t-before.t)*(after.x-before.x);
    else if(before||after)xn=(before||after).x;
    else{st('정면 폰에서 공을 못 찾음 (민감도/밝기 조정)');continue}
    judge(xn,p.yn);
  }
}
function judge(xn,yn){
  const [a,b]=cal,cx=(a.x+b.x)/2,wpx=Math.abs(b.x-a.x);
  const xcm=(xn-cx)/wpx*PW;
  const H=+$('bh').value,zh=H*(+$('hi').value-+$('lo').value)/100,ycm=yn*zh;
  const strike=Math.abs(xcm)<=PW/2+BR&&ycm>=-BR&&ycm<=zh+BR;
  const m={t:'result',strike,xcm,ycm,zh};
  conn&&conn.send(m);showResult(m);
}
function showResult(m){
  $('res').style.display='flex';
  const b=$('rb');b.textContent=m.strike?'S':'B';b.className=m.strike?'S':'B';
  $('rt').textContent=`x ${m.xcm.toFixed(1)}cm · 높이 ${m.ycm.toFixed(1)}/${m.zh.toFixed(0)}cm`;
  const c=$('zc').getContext('2d'),W=180,Hh=220;c.clearRect(0,0,W,Hh);
  const sxp=x=>W/2+x*(W/80),syp=y=>Hh-20-(y+10)*((Hh-40)/(m.zh+20));
  c.strokeStyle='#8aa0b8';c.lineWidth=2;c.strokeRect(sxp(-PW/2),syp(m.zh),PW*W/80,m.zh*((Hh-40)/(m.zh+20)));
  c.setLineDash([4,4]);c.strokeRect(sxp(-PW/2-BR),syp(m.zh+BR),(PW+2*BR)*W/80,(m.zh+2*BR)*((Hh-40)/(m.zh+20)));c.setLineDash([]);
  c.fillStyle=m.strike?'#3fb950':'#f85149';c.beginPath();c.arc(sxp(m.xcm),syp(m.ycm),BR*W/80,0,7);c.fill();
  if(navigator.vibrate)navigator.vibrate(m.strike?60:[40,40,40]);
}
function draw(){
  const W=ov.width,H=ov.height;octx.clearRect(0,0,W,H);octx.lineWidth=2;octx.strokeStyle='#ffd33d';octx.fillStyle='#ffd33d';
  cal.forEach((p,i)=>{octx.beginPath();octx.arc(p.x*W,p.y*H,6,0,7);octx.fill()});
  if(role==='side'&&cal.length){octx.beginPath();octx.moveTo(cal[0].x*W,0);octx.lineTo(cal[0].x*W,H);octx.stroke();
    if(cal.length>2)[1,2].forEach(i=>{octx.beginPath();octx.moveTo(0,cal[i].y*H);octx.lineTo(W,cal[i].y*H);octx.stroke()})}
  if(role==='front'&&cal.length>1){octx.beginPath();octx.moveTo(cal[0].x*W,0);octx.lineTo(cal[0].x*W,H);octx.moveTo(cal[1].x*W,0);octx.lineTo(cal[1].x*W,H);octx.stroke()}
  if(detDraw&&performance.timeOrigin+performance.now()-detDraw.t<300){octx.strokeStyle='#f85149';octx.beginPath();octx.arc(detDraw.x*W,detDraw.y*H,14,0,7);octx.stroke()}
}
</script><script>
document.querySelectorAll('.tile').forEach(b=>b.onclick=()=>{$('role').value=b.dataset.r;document.querySelectorAll('.tile').forEach(x=>x.classList.toggle('act',x===b))});
</script>
</body></html>
